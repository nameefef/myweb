<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DeepSeek</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8fbff 0,#f8fafc 45%,#eef2f7 100%)}
    .shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e5e7eb;padding:22px 16px;display:flex;flex-direction:column;gap:16px}
    .brand{font-weight:800;font-size:22px;letter-spacing:-.5px}.brand b{color:#2563eb}.new{border:0;border-radius:12px;background:#2563eb;color:white;padding:12px 14px;font-weight:700;cursor:pointer}.hint{font-size:13px;color:#64748b;line-height:1.5}.main{display:flex;flex-direction:column;min-width:0}.top{height:64px;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.model{border:1px solid #dbe2ea;background:#fff;border-radius:10px;padding:9px 12px}.logout{border:0;background:transparent;color:#64748b;cursor:pointer}.chat{flex:1;overflow:auto;padding:30px max(20px,calc((100vw - 980px)/2));display:flex;flex-direction:column;gap:16px}.empty{text-align:center;margin:auto;max-width:620px}.empty h1{font-size:34px;margin:0 0 10px}.empty p{color:#64748b}.msg{max-width:820px;white-space:pre-wrap;line-height:1.65;padding:14px 16px;border-radius:16px}.user{align-self:flex-end;background:#2563eb;color:#fff}.assistant{align-self:flex-start;background:#fff;border:1px solid #e5e7eb;box-shadow:0 4px 18px rgba(15,23,42,.04)}.composer{padding:16px max(20px,calc((100vw - 980px)/2)) 24px}.box{background:#fff;border:1px solid #dbe2ea;border-radius:18px;box-shadow:0 12px 35px rgba(15,23,42,.08);padding:10px;display:flex;gap:10px;align-items:flex-end}.box textarea{flex:1;border:0;outline:0;resize:none;min-height:48px;max-height:180px;padding:12px;font:inherit}.send{border:0;border-radius:12px;background:#111827;color:#fff;width:46px;height:46px;font-size:19px;cursor:pointer}.send:disabled{opacity:.45}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:white;border:1px solid #e5e7eb;border-radius:22px;padding:30px;box-shadow:0 20px 60px rgba(15,23,42,.1)}.card h1{margin:0 0 6px}.card p{color:#64748b;margin:0 0 22px}.card input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;outline:0}.card button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.error{color:#dc2626;font-size:13px;margin-top:10px}.hidden{display:none!important}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.top{padding:0 14px}.chat,.composer{padding-left:14px;padding-right:14px}}
  </style>
</head>
<body>
  <section id="login" class="login hidden"><form id="loginForm" class="card"><h1>DeepSeek</h1><p>请输入访问密码</p><input id="password" type="password" autocomplete="current-password" placeholder="密码" required><button type="submit">进入</button><div id="loginError" class="error"></div></form></section>
  <section id="app" class="shell hidden">
    <aside class="side"><div class="brand">Deep<b>Seek</b></div><button id="newChat" class="new">＋ 新对话</button><div class="hint">聊天记录仅保存在当前浏览器中。API Key 保存在 Vercel 服务端。</div></aside>
    <main class="main"><header class="top"><select id="model" class="model"><option value="deepseek-v4-flash">DeepSeek V4 Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option></select><button id="logout" class="logout">退出</button></header><div id="chat" class="chat"><div id="empty" class="empty"><h1>有什么可以帮你？</h1><p>由 DeepSeek API 驱动</p></div></div><div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息…"></textarea><button id="send" class="send">↑</button></div></div></main>
  </section>
<script>
const $=s=>document.querySelector(s); let messages=[];
async function session(){const r=await fetch('/api/session');return r.ok}
async function boot(){const ok=await session();$('#login').classList.toggle('hidden',ok);$('#app').classList.toggle('hidden',!ok);if(ok) load()}
function load(){try{messages=JSON.parse(localStorage.getItem('ds_messages')||'[]')}catch{messages=[]} render()}
function save(){localStorage.setItem('ds_messages',JSON.stringify(messages))}
function render(){const c=$('#chat');c.innerHTML='';if(!messages.length){c.innerHTML='<div id="empty" class="empty"><h1>有什么可以帮你？</h1><p>由 DeepSeek API 驱动</p></div>';return}for(const m of messages){const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.content;c.appendChild(d)}c.scrollTop=c.scrollHeight}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});if(r.ok){$('#password').value='';boot()}else $('#loginError').textContent='密码错误'});
$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});boot()};
$('#newChat').onclick=()=>{messages=[];save();render()};
async function send(){const text=$('#input').value.trim();if(!text)return;messages.push({role:'user',content:text});$('#input').value='';save();render();$('#send').disabled=true;const holder={role:'assistant',content:'正在思考…'};messages.push(holder);render();try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:$('#model').value,messages:messages.filter(m=>m!==holder)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'请求失败');holder.content=data.content||'(无内容)'}catch(e){holder.content='错误：'+e.message}finally{$('#send').disabled=false;save();render()}}
$('#send').onclick=send;$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});boot();
</script>
</body></html>
